<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Application Submitted - GRED Trusted Hyperlocal Network</title>
  
  <!-- Preconnect and Outfit Google Font -->
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#F59E0B" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
  
  <!-- Main Stylesheet Link -->
  <link rel="stylesheet" href="style.css" />

  <!-- Specific Stylesheet for GRED Provider Success Page -->
  <style>
    body {
      background-color: #fcf8f2;
      color: #1e293b;
      font-family: 'Outfit', sans-serif;
      overflow-x: hidden;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Ambient Background Glow Blobs */
    .thankyou-bg-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      pointer-events: none;
      overflow: hidden;
    }

    .thankyou-glow-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(140px);
      opacity: 0.35;
      animation: driftSlow 25s infinite alternate ease-in-out;
    }

    .thankyou-glow-blob.blob-1 {
      width: 60vw;
      height: 60vw;
      background: radial-gradient(circle, rgba(247, 166, 0, 0.25) 0%, transparent 70%);
      top: -15%;
      left: -10%;
    }

    .thankyou-glow-blob.blob-2 {
      width: 50vw;
      height: 50vw;
      background: radial-gradient(circle, rgba(234, 88, 12, 0.2) 0%, transparent 70%);
      bottom: -10%;
      right: -10%;
      animation-delay: -5s;
    }

    .thankyou-dots-grid {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(247, 166, 0, 0.08) 1.2px, transparent 1.2px);
      background-size: 32px 32px;
      pointer-events: none;
      opacity: 0.85;
    }

    /* Header adjustments to support back navigation */
    .thankyou-header {
      width: 100%;
      padding: 24px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 100;
    }

    .thankyou-brand-link {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
    }

    .thankyou-brand-text {
      font-size: 2.1rem;
      font-weight: 900;
      letter-spacing: -1.5px;
      display: inline-block;
      padding-right: 6px;
      background: linear-gradient(135deg, #111111 0%, #334155 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Centered Success Card Container */
    .thankyou-main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 5%;
      position: relative;
      z-index: 10;
    }

    .thankyou-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 28px;
      padding: 60px 48px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 28px 75px rgba(15, 23, 42, 0.08);
      position: relative;
      overflow: visible;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUpIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.1s;
    }

    .thankyou-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      border-radius: 28px 28px 0 0;
      background: linear-gradient(90deg, #f7a600, #ffbf1a);
    }

    /* Animated Checkmark SVG Container */
    .checkmark-wrapper {
      width: 86px;
      height: 86px;
      margin: 0 auto 30px;
      position: relative;
    }

    .checkmark-circle {
      stroke-dasharray: 260;
      stroke-dashoffset: 260;
      stroke-width: 4;
      stroke-miterlimit: 10;
      stroke: #10b981;
      fill: none;
      animation: drawCircle 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards 0.4s;
    }

    .checkmark-check {
      transform-origin: 50% 50%;
      stroke-dasharray: 60;
      stroke-dashoffset: 60;
      stroke-width: 4.5;
      stroke: #10b981;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      animation: drawCheck 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards 1s;
    }

    .checkmark-ring-glow {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.18);
      opacity: 0;
      transform: scale(0.7);
      animation: ringSpread 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.8s;
    }

    /* Success Text Elements */
    .thankyou-title {
      font-size: 1.88rem;
      font-weight: 800;
      color: #111111;
      line-height: 1.25;
      letter-spacing: -0.8px;
      margin-bottom: 16px;
    }

    .thankyou-desc {
      font-size: 1rem;
      line-height: 1.6;
      color: #475569;
      margin-bottom: 36px;
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
    }

    /* Action Home Button styling */
    .home-action-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 34px;
      border-radius: 14px;
      border: 1px solid rgba(255, 178, 0, 0.15);
      background: #f7a600;
      color: #111111;
      font-size: 0.98rem;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 10px 25px rgba(247, 166, 0, 0.22);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .home-action-btn:hover {
      background: #111111;
      color: #ffffff;
      border-color: #111111;
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
    }

    /* Footer styling */
    .thankyou-footer {
      border-top: 1px solid rgba(15, 23, 42, 0.06);
      background: #ffffff;
      padding: 26px 8%;
      text-align: center;
      font-size: 0.88rem;
      color: #64748b;
      position: relative;
      z-index: 5;
    }

    /* Keyframe Animations */
    @keyframes driftSlow {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(5vw, -3vh) scale(1.04); }
    }

    @keyframes fadeUpIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes drawCircle {
      to {
        stroke-dashoffset: 0;
      }
    }

    @keyframes drawCheck {
      to {
        stroke-dashoffset: 0;
      }
    }

    @keyframes ringSpread {
      to {
        opacity: 1;
        transform: scale(1.15);
      }
    }

    /* Mobile Adaptations */
    @media (max-width: 768px) {
      .thankyou-header {
        padding: 20px 5%;
      }
      .thankyou-card {
        padding: 50px 24px;
        border-radius: 24px;
      }
      .thankyou-title {
        font-size: 1.62rem;
      }
    }
  </style>
</head>
<body>

  <!-- Floating Glow Wrappers -->
  <div class="thankyou-bg-wrapper">
    <div class="thankyou-glow-blob blob-1" aria-hidden="true"></div>
    <div class="thankyou-glow-blob blob-2" aria-hidden="true"></div>
    <div class="thankyou-dots-grid" aria-hidden="true"></div>
  </div>

  <!-- Page Header -->
  <header class="thankyou-header">
    <a class="thankyou-brand-link" href="/" aria-label="GRED home">
      <span class="thankyou-brand-text">GRED</span>
    </a>
  </header>

  <!-- Center Card Main Section -->
  <main class="thankyou-main">
    <div class="thankyou-card">
      
      <!-- Premium Checkmark animation -->
      <div class="checkmark-wrapper">
        <div class="checkmark-ring-glow" aria-hidden="true"></div>
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: 100%;">
          <circle class="checkmark-circle" cx="50" cy="50" r="42" />
          <path class="checkmark-check" d="M32 50 L44 62 L68 36" />
        </svg>
      </div>

      <!-- Success Details -->
      <h1 class="thankyou-title">Application Submitted Successfully</h1>
      <p class="thankyou-desc">Our team will review your provider application and contact you shortly.</p>
      
      <!-- Back to Home Action Button -->
      <a href="/" class="home-action-btn">
        Back to Home
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle;">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </a>

    </div>
  </main>

  <!-- Footer -->
  <footer class="thankyou-footer">
    <p>&copy; 2026 GRED. All rights reserved. Made in Kerala for a smarter future.</p>
  </footer>

</body>
</html>
