<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You - GRED Investor Relations</title>
  
  <!-- Preconnect and Outfit Google Font -->
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#F59E0B" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
  
  <!-- Main Stylesheet Link -->
  <link rel="stylesheet" href="style.css" />

  <!-- Thank You Page Specific Stylesheet -->
  <style>
    body {
      background-color: #fcf8f2;
      color: #1e293b;
      font-family: 'Outfit', sans-serif;
      overflow: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .success-bg-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      pointer-events: none;
      overflow: hidden;
    }

    .success-glow-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(140px);
      opacity: 0.35;
      background: radial-gradient(circle, rgba(247, 166, 0, 0.3) 0%, transparent 70%);
      width: 60vw;
      height: 60vw;
      top: 20%;
      left: 20%;
    }

    .success-dots-grid {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(247, 166, 0, 0.08) 1.2px, transparent 1.2px);
      background-size: 30px 30px;
      pointer-events: none;
      opacity: 0.8;
    }

    /* Centered Success Card Container */
    .success-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 5%;
      z-index: 5;
    }

    .success-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 36px;
      padding: 60px 48px;
      max-width: 580px;
      width: 100%;
      text-align: center;
      box-shadow: 0 30px 80px rgba(15, 23, 42, 0.08);
      position: relative;
    }

    .success-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 5px;
      background: linear-gradient(90deg, #f7a600, #ffb81c);
      border-radius: 36px 36px 0 0;
    }

    /* Premium Checkmark Animation */
    .checkmark-wrapper {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: rgba(16, 185, 129, 0.08);
      border: 2px solid rgba(16, 185, 129, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #10b981;
      margin: 0 auto 32px;
      box-shadow: 0 10px 25px rgba(16, 185, 129, 0.1);
      animation: checkPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
    }

    .checkmark-wrapper svg {
      width: 44px;
      height: 44px;
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      animation: drawCheck 0.6s 0.3s cubic-bezier(0.25, 0.25, 0.25, 1) forwards;
    }

    @keyframes checkPop {
      0% { transform: scale(0.6); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes drawCheck {
      to { stroke-dashoffset: 0; }
    }

    .success-title {
      font-size: clamp(1.6rem, 3.5vw, 2.15rem);
      font-weight: 900;
      color: #111111;
      letter-spacing: -0.8px;
      line-height: 1.2;
      margin-bottom: 16px;
    }

    .success-desc {
      font-size: 1.02rem;
      line-height: 1.6;
      color: #475569;
      margin-bottom: 36px;
    }

    .return-home-btn {
      font-size: 1rem;
      font-weight: 800;
      color: #ffffff;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 36px;
      border-radius: 18px;
      background: linear-gradient(135deg, #111111 0%, #1f2937 100%);
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.15);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      width: 100%;
    }

    .return-home-btn:hover {
      background: linear-gradient(135deg, #f7a600 0%, #ea580c 100%);
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(247, 166, 0, 0.3);
    }

    .success-footer {
      border-top: 1px solid rgba(15, 23, 42, 0.05);
      background: #ffffff;
      padding: 24px 5%;
      text-align: center;
      font-size: 0.88rem;
      color: #64748b;
      z-index: 5;
    }
  </style>
</head>
<body>

  <!-- Floating Glow Background -->
  <div class="success-bg-wrapper">
    <div class="success-glow-blob" aria-hidden="true"></div>
    <div class="success-dots-grid" aria-hidden="true"></div>
  </div>

  <!-- Success Card Display -->
  <div class="success-container">
    <div class="success-card">
      <div class="checkmark-wrapper" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>
      <h1 class="success-title">Thank You For Your Interest In GRED</h1>
      <p class="success-desc">
        Our team has received your investor inquiry and will contact you shortly.
      </p>
      <a href="/" class="return-home-btn">
        Return to Homepage
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle;">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </a>
    </div>
  </div>

  <!-- Page Footer -->
  <footer class="success-footer">
    <p>&copy; 2026 GRED. All rights reserved. Confidential Investor Relations Desk.</p>
  </footer>

</body>
</html>
